# ServiceAccount ESO uses to log in to OpenBao (Kubernetes auth method).
# Must match the OpenBao role assign2-eso-role (bound_service_account_names/namespaces),
# see setup-openbao.sh. No TokenReview binding needed: OpenBao verifies this SA's tokens
# with its own SA (openbao/openbao), which the OpenBao chart binds to system:auth-delegator.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assign2-eso-sa
  namespace: external-secrets
