# ClusterSecretStore: cluster-wide, usable by ExternalSecrets in any namespace
# (helm/assign2/templates/db-secret.yaml in assign2-dev/stage/prod).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-cluster-store
spec:
  provider:
    vault:
      # OpenBao service URL inside the cluster
      server: "http://openbao.openbao.svc.cluster.local:8200"
      # KV v2 mount path
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "assign2-eso-role"
          # ESO uses this SA's token to authenticate with OpenBao (eso-serviceaccount.yaml)
          serviceAccountRef:
            name: assign2-eso-sa
            namespace: external-secrets
