apiVersion: v1
kind: ResourceQuota
metadata:
  name: assign2-quota
  namespace: assign2
spec:
  hard:
    requests.cpu: "4"
    limits.cpu: "8"
    requests.memory: 4Gi
    limits.memory: 8Gi
    pods: "40"
    persistentvolumeclaims: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: assign2-limits
  namespace: assign2
spec:
  limits:
  - type: Container
    min:
      cpu: 10m
      memory: 32Mi
    max:
      cpu: "1"
      memory: 1Gi
    default:
      cpu: 250m
      memory: 256Mi
    defaultRequest:
      cpu: 50m
      memory: 64Mi
