apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: assign2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-sa
  namespace: assign2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-role
  namespace: assign2
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-binding
  namespace: assign2
subjects:
- kind: ServiceAccount
  name: ops-sa
  namespace: assign2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-role
