apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: assign2
  labels:
    app: vote
spec:
  selector:
    app: vote
  ports:
  - port: 80
    targetPort: 80
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: assign2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: patch-jquery
        image: dockersamples/examplevotingapp_vote
        command:
        - sh
        - -c
        - |
          cp -a /usr/local/app/. /patched/                  # FIXED: correct source path
          sed -i 's|http://code.jquery.com|https://code.jquery.com|g' /patched/templates/index.html
          grep -n "jquery" /patched/templates/index.html || true   # FIXED: don't fail if no match
        volumeMounts:
        - name: app-patched
          mountPath: /patched
      containers:
      - name: vote
        image: dockersamples/examplevotingapp_vote
        ports:
        - containerPort: 80
        volumeMounts:
        - name: app-patched
          mountPath: /usr/local/app                          # FIXED: was /app
        env:
        - name: REDIS_HOST
          value: "redis"
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 256Mi                                    # raised from 128Mi
      volumes:
      - name: app-patched
        emptyDir: {}
      terminationGracePeriodSeconds: 30