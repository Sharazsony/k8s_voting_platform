apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-nginx
  namespace: assign2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status-nginx
  template:
    metadata:
      labels:
        app: status-nginx
    spec:
      automountServiceAccountToken: false
      containers:
      - name: status-nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: status-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-html
  namespace: assign2
data:
  index.html: |
    <html><body><h1>assign2 status page</h1><p>Application stack healthy</p></body></html>
---
apiVersion: v1
kind: Service
metadata:
  name: status-nginx
  namespace: assign2
spec:
  selector:
    app: status-nginx
  ports:
  - port: 80
    targetPort: 80
