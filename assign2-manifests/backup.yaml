apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: assign2
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: assign2
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: postgres:16-alpine
            command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /backup
              export PGPASSWORD="$POSTGRES_PASSWORD"

              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              DUMP_FILE="/backup/votes-${TIMESTAMP}.sql"

              echo "Starting dump..."
              pg_dump -h db -U "$POSTGRES_USER" -d "$POSTGRES_DB" > "$DUMP_FILE"

              echo "Dump created: $DUMP_FILE"
              ls -l "$DUMP_FILE"

              echo "Running verification dump..."
              pg_dump -h db -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /tmp/verify.sql
              ls -l /tmp/verify.sql

              echo "Backup verification passed"
            env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            volumeMounts:
            - name: backup
              mountPath: /backup
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-restore-check
  namespace: assign2
spec:
  template:
    metadata:
      labels:
        app: postgres-restore-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: restore-check
        image: postgres:16-alpine
        command:
        - /bin/sh
        - -c
        - |
          set -e
          export PGPASSWORD="$POSTGRES_PASSWORD"
          pg_dump -h db -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /tmp/dump.sql
          ls -l /tmp/dump.sql
          echo "dump generated"
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
