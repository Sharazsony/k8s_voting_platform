apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: assign2
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: assign2
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: postgres:16-alpine
            command:
            - /bin/sh
            - -c
            - |
              mkdir -p /backup
              export PGPASSWORD="$POSTGRES_PASSWORD"
              pg_dump -h db -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /backup/votes.sql
            env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            volumeMounts:
            - name: backup
              mountPath: /backup
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: postgres-backup-pvc
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-restore-check
  namespace: assign2
spec:
  template:
    metadata:
      labels:
        app: postgres-restore-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: restore-check
        image: postgres:16-alpine
        command:
        - /bin/sh
        - -c
        - |
          export PGPASSWORD="$POSTGRES_PASSWORD"
          apk add --no-cache sqlite >/dev/null 2>&1 || true
          pg_dump -h db -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/tmp/dump.sql
          echo "dump generated"
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
