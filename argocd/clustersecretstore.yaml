---
# ServiceAccount used by ClusterSecretStore to authenticate with OpenBao
# via Kubernetes auth method. Lives in external-secrets namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assign2-eso-sa
  namespace: external-secrets
---
# No TokenReview binding needed here: OpenBao verifies this SA's tokens with
# its own SA (openbao/openbao), which the OpenBao chart binds to system:auth-delegator.
# ClusterSecretStore: cluster-wide, usable by ExternalSecrets in any namespace
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-cluster-store
spec:
  provider:
    vault:
      # OpenBao service URL inside the cluster
      server: "http://openbao.openbao.svc.cluster.local:8200"
      # KV v2 mount path
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "assign2-eso-role"
          # ESO uses this SA's token to authenticate with OpenBao
          serviceAccountRef:
            name: assign2-eso-sa
            namespace: external-secrets
