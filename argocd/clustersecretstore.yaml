---
# ServiceAccount used by ClusterSecretStore to authenticate with OpenBao
# via Kubernetes auth method. Lives in external-secrets namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: assign2-eso-sa
  namespace: external-secrets
---
# ClusterRoleBinding so OpenBao can validate this SA's tokens (TokenReview)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: assign2-eso-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: assign2-eso-sa
    namespace: external-secrets
---
# ClusterSecretStore: cluster-wide, usable by ExternalSecrets in any namespace
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-cluster-store
spec:
  provider:
    vault:
      # OpenBao service URL inside the cluster
      server: "http://openbao.openbao.svc.cluster.local:8200"
      # KV v2 mount path
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "assign2-eso-role"
          # ESO uses this SA's token to authenticate with OpenBao
          serviceAccountRef:
            name: assign2-eso-sa
            namespace: external-secrets
