# Syncs the ESO ↔ OpenBao wiring (ServiceAccount + ClusterSecretStore) from openbao/*.yaml.
# setup-openbao.sh in the same folder is not a manifest and is skipped by the include filter.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sharazsony/k8s_voting_platform.git
    targetRevision: main
    path: openbao
    directory:
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
