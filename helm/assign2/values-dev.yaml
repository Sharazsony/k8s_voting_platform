# DEV — overrides only what differs from values.yaml
global:
  environment: dev
  domain: dev.lab
  adminerEnabled: true
  externalSecrets:
    enabled: true           # DB creds from OpenBao (secret/assign2/dev/db) via External Secrets

app:
  vote:
    replicaCount: 2
  result:
    replicaCount: 1
  worker:
    replicaCount: 1

security:
  hpa:
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 70
  pdb:
    minAvailable: 1
  quota:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 3Gi
    pvcs: "5"
    pods: "20"
