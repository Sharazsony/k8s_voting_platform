# DEV — overrides only what differs from values.yaml
global:
  environment: dev
  domain: dev.lab
  adminerEnabled: true
  externalSecrets:
    enabled: false          # plain Secret for dev; set true when OpenBao is ready
  dbPassword: "postgres"   # matches hardcoded app credential; replace when OpenBao is wired up

app:
  vote:
    replicaCount: 2
  result:
    replicaCount: 1
  worker:
    replicaCount: 1

security:
  hpa:
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 70
  pdb:
    minAvailable: 1
  quota:
    requests:
      cpu: "500m"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
    pvcs: "5"
    pods: "20"
