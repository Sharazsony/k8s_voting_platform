# DEV — overrides only what differs from values.yaml
global:
  environment: dev
  domain: local
  adminerEnabled: true
  externalSecrets:
    enabled: false          # plain Secret for dev; set true when OpenBao is ready
  dbPassword: "postgres"   # matches hardcoded app credential; replace when OpenBao is wired up

app:
  vote:
    replicaCount: 2
  result:
    replicaCount: 1
  worker:
    replicaCount: 1
