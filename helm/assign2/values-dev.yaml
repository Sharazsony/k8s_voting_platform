
# DEV — env-specific settings (same layout as dev/stage/prod)
# DB creds: OpenBao secret/assign2/dev/db → ESO → Secret assign2-db-secret-dev
global:
  environment: dev
  domain: dev.lab
  adminerEnabled: true     # DB admin UI on adminer.dev.lab

app:
  result:
    replicaCount: 1
  worker:
    replicaCount: 1

security:
  hpa:                     # vote replicas are owned by the HPA
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 70
  pdb:
    minAvailable: 1
  quota:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 3Gi
    pvcs: "5"
    pods: "20"

