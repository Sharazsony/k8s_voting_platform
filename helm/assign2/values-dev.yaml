# DEV — overrides only what differs from values.yaml
global:
  environment: dev
  domain: dev.lab

security:
  hpa:
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 70
  pdb:
    minAvailable: 1
  quota:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 3Gi
    pvcs: "5"
    pods: "20"
