# Base defaults — override only what differs in values-{env}.yaml
global:
  environment: dev
  domain: local
  adminerEnabled: true
  externalSecrets:
    enabled: true

# App replica counts — tune per env
app:
  vote:
    replicaCount: 2
  result:
    replicaCount: 1
  worker:
    replicaCount: 1

# Ingress
ingress:
  envoyGateway:
    gatewayClassName: eg
    listenerPort: 80
