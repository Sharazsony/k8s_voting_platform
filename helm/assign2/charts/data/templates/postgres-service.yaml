apiVersion: v1
kind: Service
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "db" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
{{ include "assign2.labels" . | indent 4 }}
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      name: postgres
