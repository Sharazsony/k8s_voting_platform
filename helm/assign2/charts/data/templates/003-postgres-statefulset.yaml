apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
{{ include "assign2.labels" . | indent 4 }}
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
{{- with .Values.postgres.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      priorityClassName: {{ .Values.postgres.priorityClassName }}
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ include "assign2.image" (dict "image" .Values.postgres.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: assign2-db-secret
                  key: postgres-password
            - name: POSTGRES_DB
              value: votes
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgres.conf
          args:
            - -c
            - config_file=/etc/postgresql/postgresql.conf
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          resources:
{{ toYaml .Values.postgres.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: postgres-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
