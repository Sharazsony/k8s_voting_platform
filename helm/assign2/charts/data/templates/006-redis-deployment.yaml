apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "redis" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis
{{ include "assign2.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: {{ include "assign2.image" (dict "image" .Values.redis.image "global" .Values.global) | quote }}
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: config
              mountPath: /etc/redis
          resources:
{{ toYaml .Values.redis.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: redis-config
