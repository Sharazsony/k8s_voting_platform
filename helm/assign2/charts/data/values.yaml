# Postgres and Redis defaults
postgres:
  image:
    repository: postgres
    tag: 16-alpine
  storage: 1Gi
  nodeSelector: {}
  priorityClassName: postgres-priority
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 250m, memory: 384Mi }

redis:
  image:
    repository: redis
    tag: 7-alpine
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }
