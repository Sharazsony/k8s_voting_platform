priorityClasses:
  postgres:
    name: postgres-priority
    value: 1000000
    description: "Postgres is scheduled before (and evicted after) app pods"
  adminer:
    name: adminer-priority
    value: 50000
    description: "DB admin UI, first to be evicted under pressure"

hpa:
  minReplicas: 3
  maxReplicas: 5
  cpuUtilization: 70

pdb:
  minAvailable: 1

quota:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 4Gi
  pvcs: "10"
  pods: "30"
