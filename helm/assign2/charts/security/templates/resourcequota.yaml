apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "assign2-quota" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.requests.cpu | quote }}
    requests.memory: {{ .Values.quota.requests.memory | quote }}
    limits.cpu: {{ .Values.quota.limits.cpu | quote }}
    limits.memory: {{ .Values.quota.limits.memory | quote }}
    persistentvolumeclaims: {{ .Values.quota.pvcs | quote }}
    pods: {{ .Values.quota.pods | quote }}
