apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "postgres-priority" "global" .Values.global "clusterScoped" true) }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
value: {{ .Values.priorityClasses.postgres.value }}
globalDefault: false
description: {{ .Values.priorityClasses.postgres.description }}
