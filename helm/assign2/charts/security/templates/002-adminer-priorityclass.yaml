{{- if .Values.global.adminerEnabled }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "adminer-priority" "global" .Values.global) }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
value: {{ .Values.priorityClasses.adminer.value }}
globalDefault: false
description: {{ .Values.priorityClasses.adminer.description }}
{{- end }}
