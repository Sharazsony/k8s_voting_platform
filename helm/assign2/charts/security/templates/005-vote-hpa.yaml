apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "vote-hpa" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "assign2.resourceName" (dict "name" "vote" "global" .Values.global) }}
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
