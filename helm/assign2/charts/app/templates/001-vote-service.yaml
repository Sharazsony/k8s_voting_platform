apiVersion: v1
kind: Service
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "vote" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: vote
{{ include "assign2.labels" . | indent 4 }}
spec:
  selector:
    app: vote
  ports:
    - port: 80
      targetPort: 80
      name: http
