{{- if .Values.vote.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: {{ .Release.Namespace }}
  labels:
    app: vote
spec:
  selector:
    app: vote
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.vote.replicaCount }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: patch-jquery
          image: {{ .Values.vote.image.repository }}:{{ .Values.vote.image.tag }}
          command:
            - sh
            - -c
            - |
              cp -a /usr/local/app/. /patched/
              sed -i 's|http://code.jquery.com|https://code.jquery.com|g' /patched/templates/index.html
              grep -n "jquery" /patched/templates/index.html || true
          volumeMounts:
            - name: app-patched
              mountPath: /patched
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: vote
          image: {{ .Values.vote.image.repository }}:{{ .Values.vote.image.tag }}
          imagePullPolicy: {{ .Values.vote.image.pullPolicy }}
          ports:
            - containerPort: 80
          env:
            - name: REDIS_HOST
              value: redis
          volumeMounts:
            - name: app-patched
              mountPath: /usr/local/app
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
{{ toYaml .Values.resources.vote | indent 12 }}
      volumes:
        - name: app-patched
          emptyDir: {}
      terminationGracePeriodSeconds: 30
{{- end }}
---
{{- if .Values.result.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: result
  namespace: {{ .Release.Namespace }}
  labels:
    app: result
spec:
  selector:
    app: result
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.result.replicaCount }}
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      automountServiceAccountToken: false
      containers:
        - name: result
          image: {{ .Values.result.image.repository }}:{{ .Values.result.image.tag }}
          imagePullPolicy: {{ .Values.result.image.pullPolicy }}
          ports:
            - containerPort: 80
          env:
            - name: POSTGRES_HOST
              value: db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          resources:
{{ toYaml .Values.resources.result | indent 12 }}
{{- end }}
---
{{- if .Values.worker.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker-sa
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 5432; do echo waiting for db; sleep 3; done"]
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 3; done"]
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: worker
          image: {{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: REDIS_HOST
              value: redis
            - name: POSTGRES_HOST
              value: db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: votes
          resources:
{{ toYaml .Values.resources.worker | indent 12 }}
{{- end }}
---
{{- if .Values.adminer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.adminer.replicaCount }}
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      automountServiceAccountToken: false
      priorityClassName: adminer-priority
      containers:
        - name: adminer
          image: {{ .Values.adminer.image.repository }}:{{ .Values.adminer.image.tag }}
          imagePullPolicy: {{ .Values.adminer.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: ADMINER_DEFAULT_DB_DRIVER
              value: pgsql
            - name: ADMINER_DEFAULT_DB_HOST
              value: db
            - name: ADMINER_DEFAULT_DB_NAME
              value: votes
            - name: ADMINER_DEFAULT_DB_USER
              value: postgres
            - name: ADMINER_DEFAULT_DB_PASSWORD
              value: postgres
          resources:
{{ toYaml .Values.resources.adminer | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: adminer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}
