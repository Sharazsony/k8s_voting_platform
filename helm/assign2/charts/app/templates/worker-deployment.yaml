apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "worker" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: worker
{{ include "assign2.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: {{ include "assign2.resourceName" (dict "name" "worker-sa" "global" .Values.global) }}
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: {{ include "assign2.image" (dict "image" .Values.worker.initImage "global" .Values.global) }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "assign2.resourceName" (dict "name" "db" "global" .Values.global) }} 5432; do
                echo waiting for db; sleep 3
              done
          resources:
{{ toYaml .Values.worker.initResources | indent 12 }}
        - name: wait-for-redis
          image: {{ include "assign2.image" (dict "image" .Values.worker.initImage "global" .Values.global) }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "assign2.resourceName" (dict "name" "redis" "global" .Values.global) }} 6379; do
                echo waiting for redis; sleep 3
              done
          resources:
{{ toYaml .Values.worker.initResources | indent 12 }}
      containers:
        - name: worker
          image: {{ include "assign2.image" (dict "image" .Values.worker.image "global" .Values.global) }}
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: {{ include "assign2.resourceName" (dict "name" "redis" "global" .Values.global) }}
            - name: POSTGRES_HOST
              value: {{ include "assign2.resourceName" (dict "name" "db" "global" .Values.global) }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
                  key: postgres-password
            - name: POSTGRES_DB
              value: postgres   # worker/result images hardcode the "postgres" database
          resources:
{{ toYaml .Values.resources.worker | indent 12 }}
