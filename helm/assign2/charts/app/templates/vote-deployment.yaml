apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "vote" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: vote
{{ include "assign2.labels" . | indent 4 }}
spec:
  # no replicas: the HPA (security/vote-hpa.yaml) owns the count, min/max per env in values
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      automountServiceAccountToken: false
      containers:
        - name: vote
          image: {{ include "assign2.image" (dict "image" .Values.vote.image "global" .Values.global) }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
{{ toYaml .Values.resources.vote | indent 12 }}
      terminationGracePeriodSeconds: 30
