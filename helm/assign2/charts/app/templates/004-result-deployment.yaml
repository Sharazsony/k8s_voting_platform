apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: {{ .Release.Namespace }}
  labels:
    app: result
{{ include "assign2.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.result.replicaCount }}
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      automountServiceAccountToken: false
      containers:
        - name: result
          image: {{ include "assign2.image" (dict "image" .Values.result.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.result.image.pullPolicy }}
          ports:
            - containerPort: 80
          env:
            - name: POSTGRES_HOST
              value: db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: assign2-db-secret
                  key: postgres-password
          resources:
{{ toYaml .Values.resources.result | indent 12 }}
