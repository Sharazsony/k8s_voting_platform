apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "result" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: result
{{ include "assign2.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.result.replicaCount }}
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: patch-db-host
          image: {{ include "assign2.image" (dict "image" .Values.result.image "global" .Values.global) }}
          command:
            - sh
            - -c
            - |
              cp -a /usr/local/app/. /patched/
              # patch hardcoded host: @db/ → @db-{env}/
              sed -i "s|@db/postgres|@${POSTGRES_HOST}/postgres|g" /patched/server.js
              # patch hardcoded user/pass: postgres:postgres → real creds from env
              sed -i "s|postgres://postgres:postgres@|postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@|g" /patched/server.js
              echo "connection patch:" && grep "connectionString" /patched/server.js
          env:
            - name: POSTGRES_HOST
              value: {{ include "assign2.resourceName" (dict "name" "db" "global" .Values.global) }}
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
                  key: postgres-password
          volumeMounts:
            - name: app-patched
              mountPath: /patched
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      containers:
        - name: result
          image: {{ include "assign2.image" (dict "image" .Values.result.image "global" .Values.global) }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: POSTGRES_HOST
              value: {{ include "assign2.resourceName" (dict "name" "db" "global" .Values.global) }}
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
                  key: postgres-password
          volumeMounts:
            - name: app-patched
              mountPath: /usr/local/app
          resources:
{{ toYaml .Values.resources.result | indent 12 }}
      volumes:
        - name: app-patched
          emptyDir: {}
