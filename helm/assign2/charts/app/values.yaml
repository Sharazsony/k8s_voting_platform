vote:
  enabled: true
  replicaCount: 3
  image:
    repository: dockersamples/examplevotingapp_vote
    tag: latest
    pullPolicy: IfNotPresent
result:
  enabled: true
  replicaCount: 1
  image:
    repository: dockersamples/examplevotingapp_result
    tag: latest
    pullPolicy: IfNotPresent
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: dockersamples/examplevotingapp_worker
    tag: latest
    pullPolicy: IfNotPresent
adminer:
  enabled: true
  replicaCount: 1
  image:
    repository: adminer
    tag: "4"
    pullPolicy: IfNotPresent
resources:
  vote:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  result:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  worker:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  adminer:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
