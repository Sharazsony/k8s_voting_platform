# Default replica counts and images — override via parent values-{env}.yaml
vote:
  replicaCount: 1
  image:
    repository: dockersamples/examplevotingapp_vote
    tag: latest

result:
  replicaCount: 1
  image:
    repository: dockersamples/examplevotingapp_result
    tag: latest

worker:
  replicaCount: 1
  image:
    repository: dockersamples/examplevotingapp_worker
    tag: latest

adminer:
  replicaCount: 1
  priorityClassName: adminer-priority
  image:
    repository: adminer
    tag: "4"

resources:
  vote:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 300m, memory: 256Mi }
  result:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 300m, memory: 128Mi }
  worker:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }
  adminer:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }
