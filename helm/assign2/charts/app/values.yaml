# Default replica counts and images — override via parent values-{env}.yaml
vote:
  image:
    repository: dockersamples/examplevotingapp_vote
    tag: latest

result:
  replicaCount: 1
  image:
    repository: dockersamples/examplevotingapp_result
    tag: latest

worker:
  replicaCount: 1
  image:
    repository: dockersamples/examplevotingapp_worker
    tag: latest
  # wait-for-db / wait-for-redis init containers
  initImage:
    repository: busybox
    tag: "1.36"
  initResources:
    requests: { cpu: 20m, memory: 16Mi }
    limits:   { cpu: 50m, memory: 32Mi }

adminer:
  replicaCount: 1
  priorityClassName: adminer-priority
  image:
    repository: adminer
    tag: "4"

resources:
  vote:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 300m, memory: 256Mi }
  result:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 300m, memory: 128Mi }
  worker:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }
  adminer:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }
