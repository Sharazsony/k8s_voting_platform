{{- $domain := required "set global.domain" .Values.global.domain -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "vote-route" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ printf "vote.%s" $domain | quote }}
  rules:
    - backendRefs:
        - name: {{ include "assign2.resourceName" (dict "name" "vote" "global" .Values.global) }}
          port: 80
