{{- $domain := required "set global.domain" .Values.global.domain -}}
{{- $useShared := default false .Values.envoyGateway.useSharedGateway -}}
{{- $gatewayName := ternary "shared-gateway" (printf "%s-gateway" .Release.Name) $useShared -}}
{{- $gatewayNamespace := ternary "envoy-gateway-system" .Release.Namespace $useShared -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "vote-route" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: http
  hostnames:
    - {{ printf "vote.%s" $domain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "assign2.resourceName" (dict "name" "vote" "global" .Values.global) }}
          port: 80
