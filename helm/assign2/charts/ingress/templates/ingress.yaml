{{- $domain := required "set global.domain (use -f values-<env>.yaml)" .Values.global.domain -}}
{{- $gatewayName := printf "%s-gateway" .Release.Name -}}
{{- $gatewayClassName := .Values.envoyGateway.gatewayClassName | default "eg" -}}
{{- $listenerPort := .Values.envoyGateway.listenerPort | default 80 -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gatewayName }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
spec:
  gatewayClassName: {{ $gatewayClassName }}
  listeners:
    - name: http
      port: {{ $listenerPort }}
      protocol: HTTP
      hostname: "*.{{ $domain }}"
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "vote-route" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: http
  hostnames:
    - {{ printf "vote.%s" $domain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "assign2.resourceName" (dict "name" "vote" "global" .Values.global) }}
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "result-route" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: http
  hostnames:
    - {{ printf "result.%s" $domain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "assign2.resourceName" (dict "name" "result" "global" .Values.global) }}
          port: 80
{{- if .Values.global.adminerEnabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "adminer-route" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: http
  hostnames:
    - {{ printf "adminer.%s" $domain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /adminer
      backendRefs:
        - name: {{ include "assign2.resourceName" (dict "name" "adminer" "global" .Values.global) }}
          port: 8080
{{- end }}
