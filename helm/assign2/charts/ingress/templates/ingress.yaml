{{- $domain := required "set global.domain (use -f values-<env>.yaml)" .Values.global.domain -}}
{{- $secretName := .Values.secretName | default "assign2-tls" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assign2-traefik
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-scheme: https
    traefik.ingress.kubernetes.io/redirect-permanent: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
{{ include "assign2.hosts" . | nindent 8 }}
      secretName: {{ $secretName }}
  rules:
    - host: {{ printf "vote.%s" $domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vote
                port:
                  number: 80
    - host: {{ printf "result.%s" $domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: result
                port:
                  number: 80
{{- if .Values.global.adminerEnabled }}
    - host: {{ printf "adminer.%s" $domain }}
      http:
        paths:
          - path: /adminer
            pathType: Prefix
            backend:
              service:
                name: adminer
                port:
                  number: 8080
{{- end }}
