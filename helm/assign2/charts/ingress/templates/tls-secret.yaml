{{- if .Values.enabled }}
{{- $hosts := .Values.hostNames | default (list "vote.local" "result.local" "adminer.local") -}}
{{- $cn := (first $hosts) | default "vote.local" -}}
{{- $ca := genCA "assign2-ca" 3650 -}}
{{- $cert := genSignedCert $cn nil $hosts 3650 $ca -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName | default "assign2-tls" }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
