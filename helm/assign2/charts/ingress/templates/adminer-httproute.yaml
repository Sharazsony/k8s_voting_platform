{{- if .Values.global.adminerEnabled }}
{{- $domain := required "set global.domain" .Values.global.domain -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "adminer-route" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: shared-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - {{ printf "adminer.%s" $domain | quote }}
  rules:
    - backendRefs:
        - name: {{ include "assign2.resourceName" (dict "name" "adminer" "global" .Values.global) }}
          port: 8080
{{- end }}
