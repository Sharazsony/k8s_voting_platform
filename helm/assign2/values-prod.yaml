# PROD — env-specific settings (same layout as dev/stage/prod)
# DB creds: OpenBao secret/assign2/prod/db → ESO → Secret assign2-db-secret-prod
global:
  environment: prod
  domain: prod.lab
  adminerEnabled: false    # no DB admin UI in prod

app:
  result:
    replicaCount: 2
  worker:
    replicaCount: 2

security:
  hpa:                     # vote replicas are owned by the HPA
    minReplicas: 5
    maxReplicas: 10
    cpuUtilization: 60
  pdb:
    minAvailable: 2
  quota:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "8"
      memory: 8Gi
    pvcs: "7"
    pods: "50"
