global:
  environment: prod
  domain: example.com
  adminerEnabled: false
  # SealedSecrets OFF — secrets come from OpenBao via ESO
  sealedSecrets:
    enabled: false
  # ExternalSecrets ON — ESO creates secrets from OpenBao paths:
  #   secret/assign2/prod/db  → assign2-db-secret-prod
  #   secret/assign2/prod/tls → assign2-tls-prod
  externalSecrets:
    enabled: true

# No sealedSecrets block here — sensitive data lives in OpenBao only
sealedSecrets:
  enabled: false

ingress:
  envoyGateway:
    gatewayClassName: eg
    listenerPort: 80
