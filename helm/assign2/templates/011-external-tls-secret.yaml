{{- if (default false .Values.global.externalSecrets.enabled) }}
---
# ExternalSecret: pulls TLS cert+key from OpenBao and creates a
# kubernetes.io/tls Secret for the ingress/gateway.
# Secret name: assign2-tls-<env>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "assign2-tls" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: {{ include "assign2.resourceName" (dict "name" "assign2-tls" "global" .Values.global) }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        # Path in OpenBao: secret/data/assign2/<env>/tls
        key: assign2/{{ .Values.global.environment }}/tls
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: assign2/{{ .Values.global.environment }}/tls
        property: tls.key
{{- end }}
