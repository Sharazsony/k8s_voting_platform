{{- if (default false .Values.global.externalSecrets.enabled) }}
---
# ExternalSecret: pulls postgres-password from OpenBao and creates
# the Kubernetes Secret that postgres StatefulSet expects.
# Secret name matches what 003-postgres-statefulset.yaml references:
#   assign2-db-secret-<env>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        # Path in OpenBao: secret/data/assign2/<env>/db
        key: assign2/{{ .Values.global.environment }}/db
        property: postgres-password
{{- end }}
