{{- /*
  DB credentials Secret assign2-db-secret-<env> (postgres-user, postgres-password),
  pulled by ESO from OpenBao secret/assign2/<env>/db via ClusterSecretStore openbao-cluster-store.
*/ -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
    creationPolicy: Owner
  data:
    - secretKey: postgres-user
      remoteRef:
        key: assign2/{{ .Values.global.environment }}/db
        property: postgres-user
    - secretKey: postgres-password
      remoteRef:
        key: assign2/{{ .Values.global.environment }}/db
        property: postgres-password
