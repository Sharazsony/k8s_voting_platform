{{- if not (default false .Values.global.externalSecrets.enabled) }}
---
# Plain Secret — used for dev while OpenBao is not yet wired up.
# To switch to OpenBao (ESO), set global.externalSecrets.enabled=true
# and ensure the ClusterSecretStore + secret path are ready.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "set global.dbPassword in values-<env>.yaml" .Values.global.dbPassword | quote }}
{{- else }}
---
# ExternalSecret — pulls postgres-password from OpenBao.
# Active when global.externalSecrets.enabled=true.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: assign2/{{ .Values.global.environment }}/db
        property: postgres-password
{{- end }}
