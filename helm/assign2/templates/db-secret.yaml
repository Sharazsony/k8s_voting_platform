{{- /*
  DB password Secret: assign2-db-secret-<env>, key "postgres-password".

  externalSecrets.enabled=false → chart creates NOTHING. Create the Secret
  yourself before install (password never goes into values files):
    kubectl create secret generic assign2-db-secret-<env> -n <namespace> \
      --from-literal=postgres-user=postgres --from-literal=postgres-password='<password>'

  externalSecrets.enabled=true → ExternalSecret pulls it from OpenBao via ESO.
*/ -}}
{{- if .Values.global.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "assign2.labels" . | indent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-cluster-store
    kind: ClusterSecretStore
  target:
    name: {{ include "assign2.resourceName" (dict "name" "assign2-db-secret" "global" .Values.global) }}
    creationPolicy: Owner
  data:
    - secretKey: postgres-user
      remoteRef:
        key: assign2/{{ .Values.global.environment }}/db
        property: postgres-user
    - secretKey: postgres-password
      remoteRef:
        key: assign2/{{ .Values.global.environment }}/db
        property: postgres-password
{{- end }}
