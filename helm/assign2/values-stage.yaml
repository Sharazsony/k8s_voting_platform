global:
  environment: stage
  domain: stage.example.com
  adminerEnabled: true
  # SealedSecrets OFF — secrets come from OpenBao via ESO
  sealedSecrets:
    enabled: false
  # ExternalSecrets ON — ESO creates secrets from OpenBao paths:
  #   secret/assign2/stage/db  → assign2-db-secret-stage
  #   secret/assign2/stage/tls → assign2-tls-stage
  externalSecrets:
    enabled: true

# No sealedSecrets block here — sensitive data lives in OpenBao only
sealedSecrets:
  enabled: false

ingress:
  envoyGateway:
    gatewayClassName: eg
    listenerPort: 80
