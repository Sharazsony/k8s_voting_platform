# STAGE — overrides only what differs from values.yaml
global:
  environment: stage
  domain: stage.lab

security:
  hpa:
    minReplicas: 2
    maxReplicas: 6
    cpuUtilization: 65
  pdb:
    minAvailable: 1
  quota:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
    pvcs: "10"
    pods: "30"
